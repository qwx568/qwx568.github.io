<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
  <link rel="manifest" href="manifest.json">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cogpitch 口播练习器</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      colors: {
        darkbg: '#121622',
        darkcard: '#1a2030',
        darkcard2: '#242b3d',
        amberbtn: '#f59e0b'
      }
    }
  }
}
</script>
<style>
*{box-sizing:border-box}
body{font-family:system-ui, -apple-system, sans-serif}
.history-panel{
  transform: translateX(100%);
  transition: transform .3s ease;
}
.history-panel.open{transform: translateX(0)}
.domain-panel{
  transform: translateY(-10px);
  opacity: 0;
  pointer-events: none;
  transition: .2s ease;
}
.domain-panel.open{
  transform: translateY(0);
  opacity: 1;
  pointer-events: auto;
}
.scroll-active #keyword,
.scroll-active #prompt{
  animation: fastScroll .06s infinite;
}
@keyframes fastScroll{
  0%{opacity:.35}
  50%{opacity:1}
  100%{opacity:.35}
}
</style>
</head>
<body class="dark bg-darkbg text-slate-100 min-h-screen relative overflow-x-hidden">

<div class="max-w-5xl mx-auto p-4">

  <!-- 顶部栏：更小 -->
  <div class="flex justify-between items-center mb-3">
    <h1 class="text-2xl font-bold tracking-wide">Cogpitch</h1>
    <button id="openHistoryBtn" class="bg-darkcard2 hover:bg-slate-700 px-3 py-1.5 rounded-lg text-sm">历史记录</button>
  </div>

  <!-- 顶部控制面板：电脑/平板单屏紧凑布局 -->
  <div class="grid grid-cols-2 md:grid-cols-4 gap-2 mb-3">
    <!-- 领域选择 -->
    <div class="relative">
      <label class="block text-xs text-slate-400 mb-1">选择领域</label>
      <button id="domainBtn" class="w-full bg-darkcard border border-slate-600 rounded-lg px-3 py-2 text-left flex justify-between items-center text-sm">
        <span id="domainBtnText" class="truncate">全部领域</span>
        <span class="text-slate-400">▾</span>
      </button>
      <div id="domainPanel" class="domain-panel absolute left-0 right-0 top-full mt-2 bg-darkcard border border-slate-600 rounded-xl p-3 z-40 shadow-xl">
        <div class="grid grid-cols-2 gap-2 max-h-[320px] overflow-y-auto">
          <label class="flex items-center gap-2 bg-darkcard2 px-3 py-2 rounded-lg text-sm">
            <input type="checkbox" class="domain-check" value="psych" checked>心理学
          </label>
          <label class="flex items-center gap-2 bg-darkcard2 px-3 py-2 rounded-lg text-sm">
            <input type="checkbox" class="domain-check" value="phil" checked>哲学
          </label>
          <label class="flex items-center gap-2 bg-darkcard2 px-3 py-2 rounded-lg text-sm">
            <input type="checkbox" class="domain-check" value="history" checked>历史
          </label>
          <label class="flex items-center gap-2 bg-darkcard2 px-3 py-2 rounded-lg text-sm">
            <input type="checkbox" class="domain-check" value="culture" checked>人文文化
          </label>
          <label class="flex items-center gap-2 bg-darkcard2 px-3 py-2 rounded-lg text-sm">
            <input type="checkbox" class="domain-check" value="econ" checked>经济学
          </label>
          <label class="flex items-center gap-2 bg-darkcard2 px-3 py-2 rounded-lg text-sm">
            <input type="checkbox" class="domain-check" value="health" checked>健康生活
          </label>
        </div>
        <div class="mt-3 flex gap-2">
          <button id="checkAllBtn" class="flex-1 bg-slate-700 hover:bg-slate-600 py-1.5 rounded-lg text-sm">全选</button>
          <button id="clearAllBtn" class="flex-1 bg-slate-700 hover:bg-slate-600 py-1.5 rounded-lg text-sm">清空</button>
          <button id="confirmDomainBtn" class="flex-1 bg-amberbtn hover:bg-amber-500 text-black py-1.5 rounded-lg text-sm font-semibold">确定</button>
        </div>
      </div>
    </div>

    <!-- 抽取模式 -->
    <div>
      <label class="block text-xs text-slate-400 mb-1">抽取模式</label>
      <select id="mode" class="w-full bg-darkcard border border-slate-600 rounded-lg px-3 py-2 text-sm">
        <option value="both">两者混合</option>
        <option value="question">只抽思考题</option>
        <option value="word">只抽词条</option>
      </select>
    </div>

    <!-- 搜集时长 -->
    <div>
      <label class="block text-xs text-slate-400 mb-1">搜集时长(分钟)</label>
      <select id="collectTime" class="w-full bg-darkcard border border-slate-600 rounded-lg px-3 py-2 text-sm">
        <option value="3">3</option>
        <option value="5">5</option>
        <option value="10">10</option>
        <option value="15" selected>15</option>
        <option value="20">20</option>
      </select>
    </div>

    <!-- 输出时长 -->
    <div>
      <label class="block text-xs text-slate-400 mb-1">输出时长(分钟)</label>
      <select id="outTime" class="w-full bg-darkcard border border-amber-400 rounded-lg px-3 py-2 text-sm">
        <option value="0.5">30秒</option>
        <option value="1" selected>1分钟</option>
        <option value="2">2分钟</option>
      </select>
    </div>
  </div>

  <!-- 中间大选题卡片 -->
  <div id="cardTopic" class="bg-darkcard rounded-2xl p-6 md:p-10 text-center min-h-[420px] flex flex-col justify-center items-center shadow-lg mb-4">
    <div id="keyword" class="text-6xl md:text-8xl font-extrabold mb-5 leading-tight">心流</div>
    <div id="prompt" class="text-xl md:text-3xl text-slate-300 leading-relaxed px-2">你做什么最容易进入心流？怎么增加这类时间？</div>
  </div>

  <!-- 底部控制区：更小、更紧凑 -->
  <div class="bg-darkcard rounded-2xl p-4 shadow-lg">
    <div class="flex flex-col md:flex-row gap-3 items-stretch md:items-center justify-between">
      <!-- 滚动选题大按钮 -->
      <button id="startRollBtn" class="flex-1 bg-amberbtn hover:bg-amber-500 text-black font-bold py-4 rounded-2xl text-lg shadow-md">
        开始滚动选题
      </button>

      <!-- 计时区 -->
      <div class="flex items-center gap-2">
        <div id="timerDisplay" class="text-4xl md:text-5xl font-extrabold tracking-wider bg-darkcard2 px-4 py-2 rounded-xl min-w-[140px] text-center">15:00</div>

        <button id="startTimerBtn" class="bg-blue-500 hover:bg-blue-600 py-2 px-3 rounded-xl text-sm font-semibold">开始计时</button>
        <button id="pauseTimerBtn" class="bg-orange-500 hover:bg-orange-600 py-2 px-3 rounded-xl text-sm font-semibold">暂停</button>
        <button id="resetBtn" class="bg-slate-500 hover:bg-slate-600 py-2 px-3 rounded-xl text-sm font-semibold">重置</button>
        <button id="rollNewBtn" class="bg-green-600 hover:bg-green-700 py-2 px-3 rounded-xl text-sm font-semibold">换个选题</button>
      </div>
    </div>
  </div>

</div>

<!-- 历史记录面板 -->
<div id="historyPanel" class="history-panel fixed top-0 right-0 h-screen w-80 bg-darkcard p-5 overflow-y-auto z-50">
  <div class="flex justify-between items-center mb-4">
    <h2 class="text-xl font-bold">历史记录</h2>
    <button id="closeHistoryBtn" class="text-2xl">&times;</button>
  </div>

  <div class="mb-4 space-y-3">
    <label class="flex items-center gap-2 bg-darkcard2 p-3 rounded-lg">
      <input type="checkbox" id="noRepeatCheck">
      <span>抽取内容永不重复</span>
    </label>
    <button id="clearHistoryBtn" class="w-full bg-red-600 hover:bg-red-700 py-3 rounded-lg font-semibold">清空全部历史</button>
  </div>

  <div id="historyList" class="space-y-3 text-sm"></div>
</div>

function renderHistory(){
  const wrap = document.getElementById('historyList')
  wrap.innerHTML = ""
  if(history.length === 0){
    wrap.innerHTML = `<div class="text-slate-400">暂无记录</div>`
    return
  }
  history.slice().reverse().forEach(item=>{
    const div = document.createElement('div')
    div.className = "border border-slate-600 p-3 rounded-lg"
    div.innerHTML = `
      <div class="text-amber-300">${item.date}</div>
      <div class="font-bold text-lg">${item.word}</div>
      <div class="text-slate-300 mt-1">${item.question}</div>
    `
    wrap.appendChild(div)
  })
}

function saveStorage(){
  localStorage.setItem("cogpitch_history", JSON.stringify(history))
  localStorage.setItem("cogpitch_used", JSON.stringify(usedWords))
  localStorage.setItem("cogpitch_norepeat", String(noRepeat))
}

// 音效初始化
let audioCtx = null
function ensureAudio(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)()
  }
  if(audioCtx.state === 'suspended'){
    audioCtx.resume()
  }
}

// 抽卡滚动：卡牌翻动沙沙音效
function playRollSound(){
  ensureAudio()
  const osc = audioCtx.createOscillator()
  const gain = audioCtx.createGain()
  const filter = audioCtx.createBiquadFilter()
  filter.type = "highpass"
  filter.frequency.value = 1800
  osc.type = 'triangle'
  osc.frequency.value = 220 + Math.random() * 180
  gain.gain.value = 0.03
  osc.connect(filter)
  filter.connect(gain)
  gain.connect(audioCtx.destination)
  osc.start()
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.06)
  osc.stop(audioCtx.currentTime + 0.07)
}

// 抽卡定格：卡牌选中清脆叮声（卡牌落桌）
function playSelectSound(){
  ensureAudio()
  const t0 = audioCtx.currentTime
  // 主音
  const osc1 = audioCtx.createOscillator()
  const gain1 = audioCtx.createGain()
  osc1.type = 'sine'
  osc1.frequency.value = 880
  gain1.gain.setValueAtTime(0, t0)
  gain1.gain.exponentialRampToValueAtTime(0.12, t0 + 0.01)
  gain1.gain.exponentialRampToValueAtTime(0.001, t0 + 0.22)
  osc1.connect(gain1)
  gain1.connect(audioCtx.destination)
  osc1.start(t0)
  osc1.stop(t0 + 0.24)

  // 轻微低频衬音，像卡牌拍桌面的闷响
  const osc2 = audioCtx.createOscillator()
  const gain2 = audioCtx.createGain()
  osc2.type = 'sine'
  osc2.frequency.value = 220
  gain2.gain.setValueAtTime(0, t0)
  gain2.gain.exponentialRampToValueAtTime(0.06, t0 + 0.01)
  gain2.gain.exponentialRampToValueAtTime(0.001, t0 + 0.12)
  osc2.connect(gain2)
  gain2.connect(audioCtx.destination)
  osc2.start(t0)
  osc2.stop(t0 + 0.14)
}

let rollTimer = null
let rollingState = false
const cardTopic = document.getElementById('cardTopic')
const keywordDom = document.getElementById('keyword')
const promptDom = document.getElementById('prompt')

function startRoll(){
  const pool = getCheckedPool()
  if(pool.length <= 0) return

  if(noRepeat){
    const leftPool = pool.filter(w=>!usedWords.includes(w))
    if(leftPool.length === 0){
      alert("当前选中领域词条已经全部抽完，请清空历史或更换领域！")
      return
    }
  }

  ensureAudio()
  rollingState = true
  cardTopic.classList.add('scroll-active')

  rollTimer = setInterval(()=>{
    const tempPool = getCheckedPool()
    const pick = tempPool[Math.floor(Math.random()*tempPool.length)]
    const mode = document.getElementById('mode').value

    keywordDom.innerText = pick

    if(mode === 'word'){
      promptDom.innerText = ""
    }else{
      const qFn = tpls[Math.floor(Math.random()*tpls.length)]
      promptDom.innerText = qFn(pick)
    }

    playRollSound()
  }, 65)
}

function stopRoll(){
  clearInterval(rollTimer)
  rollingState = false
  cardTopic.classList.remove('scroll-active')

  const pick = keywordDom.innerText
  const q = promptDom.innerText
  const now = new Date()
  const dateStr = now.toLocaleString('zh-CN')

  history.push({date:dateStr, word:pick, question:q})
  usedWords.push(pick)
  saveStorage()
  renderHistory()

  playSelectSound()
}

let totalSeconds = 15 * 60
let remain = totalSeconds
let timerId = null
let timerRunning = false
const timerDom = document.getElementById('timerDisplay')

function formatTime(s){
  const m = Math.floor(s / 60)
  const sec = s % 60
  return `${m}:${String(sec).padStart(2,'0')}`
}
timerDom.innerText = formatTime(remain)

document.getElementById('collectTime').onchange = function(){
  const min = Number(this.value)
  totalSeconds = min * 60
  remain = totalSeconds
  timerDom.innerText = formatTime(remain)
  if(timerId){clearInterval(timerId); timerRunning = false}
}

document.getElementById('startRollBtn').onclick = function(){
  if(rollingState){
    stopRoll()
    this.innerText = "开始滚动选题"
    this.classList.remove('bg-red-500','hover:bg-red-600')
    this.classList.add('bg-amberbtn','hover:bg-amber-500')
  }else{
    startRoll()
    this.innerText = "停止并锁定选题"
    this.classList.remove('bg-amberbtn','hover:bg-amber-500')
    this.classList.add('bg-red-500','hover:bg-red-600')
  }
}

document.getElementById('startTimerBtn').onclick = ()=>{
  ensureAudio()
  if(timerRunning) return
  timerRunning = true
  timerId = setInterval(()=>{
    remain--
    timerDom.innerText = formatTime(remain)
    if(remain <= 0){
      clearInterval(timerId)
      timerRunning = false
      alert("练习时间结束！")
    }
  },1000)
}

document.getElementById('pauseTimerBtn').onclick = ()=>{
  ensureAudio()
  clearInterval(timerId)
  timerRunning = false
}

document.getElementById('resetBtn').onclick = ()=>{
  ensureAudio()
  clearInterval(timerId)
  timerRunning = false
  remain = totalSeconds
  timerDom.innerText = formatTime(remain)
}

document.getElementById('rollNewBtn').onclick = ()=>{
  if(rollingState) return
  ensureAudio()
  startRoll()
  setTimeout(()=> stopRoll(), 320)
}

// 领域面板
const domainBtn = document.getElementById('domainBtn')
const domainPanel = document.getElementById('domainPanel')
const domainBtnText = document.getElementById('domainBtnText')

function updateDomainBtnText(){
  const checked = Array.from(document.querySelectorAll('.domain-check:checked'))
  if(checked.length === 0){
    domainBtnText.innerText = "请选择领域"
  }else if(checked.length === document.querySelectorAll('.domain-check').length){
    domainBtnText.innerText = "全部领域"
  }else{
    domainBtnText.innerText = checked.map(el=> el.parentElement.innerText.trim()).join('、')
  }
}

domainBtn.onclick = (e)=>{
  e.stopPropagation()
  domainPanel.classList.toggle('open')
}

document.getElementById('confirmDomainBtn').onclick = ()=>{
  updateDomainBtnText()
  domainPanel.classList.remove('open')
}

document.getElementById('checkAllBtn').onclick = ()=>{
  document.querySelectorAll('.domain-check').forEach(el=> el.checked = true)
}

document.getElementById('clearAllBtn').onclick = ()=>{
  document.querySelectorAll('.domain-check').forEach(el=> el.checked = false)
}

document.addEventListener('click', (e)=>{
  if(!domainPanel.contains(e.target) && !domainBtn.contains(e.target)){
    domainPanel.classList.remove('open')
  }
})
